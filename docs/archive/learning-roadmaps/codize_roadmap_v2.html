    id:3, title:'LLM API Fundamentals', dayLabel:'13-19', duration:'7 days', color:'#a78bfa',

    days:[
      {
        id:'d3_0', num:'Day 13', title:'How LLMs Work — Conceptual Foundation',
        note:'No code today. If you build the gate without understanding what a token is, what a context window does, and why temperature=0 matters for evaluation, you will make architectural decisions that are expensive to undo. One day of concepts saves a week of debugging.',
        concepts:[
          'What a token is — not a word, not a character. Use the tokenizer tool for 20 minutes. Codize\'s gate prompt (system + anchor + 3 turns + rubric) must budget for token count.',
          'Context windows — a hard limit on tokens in + out combined. The full gate conversation must fit within the model\'s window.',
          'The message array: system, user, assistant roles — every LLM call in Codize uses this structure. The gate maintains conversation by appending to this array.',
          'Temperature — 0.0 = fully deterministic. Gate evaluation uses temp=0. Turn 1 questions use 0.3. Phase explanations use 0.7. Understand why each is different.',
          '`max_tokens` — setting this too low truncates the evaluator\'s response mid-sentence. Gate evaluation responses are short — calibrate accordingly.',
          'Stateless completions — the model has ZERO memory between separate API calls. Codize must resend the full gate conversation context on every turn.',
          'Why LLMs hallucinate — probabilistic next-token prediction, not retrieval. Why the gate rubric cannot rely on the model knowing the student\'s actual code (it doesn\'t).',
          'GPT-4o vs Claude Sonnet — instruction-following reliability matters most for the gate evaluation call. Test both.',
          'What fine-tuning is vs prompting — Codize uses prompting exclusively. Fine-tuning is v3+ territory.',
        ],
        resources:[
          {text:'Andrej Karpathy — Intro to LLMs (1hr YouTube)', url:'https://www.youtube.com/watch?v=zjkBMFhNj_g', note:'WATCH THE WHOLE THING'},
          {text:'OpenAI Tokenizer — interactive tool', url:'https://platform.openai.com/tokenizer', note:'Play with this for 20 min'},
          {text:'Anthropic — Claude Models + Context Windows', url:'https://docs.anthropic.com/en/docs/about-claude/models', note:'Current models'},

    days:[

          'Security decisions section — explain the three non-negotiable constraints and why. Show you understand the threat model, not just followed a checklist.',
          'Tech stack table — each tool, one-line reason why you chose it over alternatives',
          'How to run locally — exact commands, every env var listed with description (not values), zero assumptions',
          'What you learned + Phase 2 roadmap — mention code submission, AST analysis, VS Code extension as next steps',
          'Demo GIF or screenshots — visual proof the gate works end-to-end',
        ],
        resources:[
          {text:'Excalidraw — Architecture Diagrams', url:'https://excalidraw.com/', note:'Free, great for technical diagrams'},
          {text:'readme.so — README Builder', url:'https://readme.so/', note:'Visual structure tool'},
          {text:'GitHub — About READMEs', url:'https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes', note:'Markdown formatting'},
        ],
        checkpoint:null
      },
      {
        id:'d8_3', num:'Day 52', title:'Final Self-Assessment — Phase 1 Complete',
        concepts:[], resources:[],
        checkpoint:{
          title:'Answer All 8 Without Looking Anything Up. In Writing.',
          items:[
            '1. Why does storing your Anthropic API key in a Next.js .env file NOT protect it, and what is the correct architecture?',
            '2. What are the three conditions of the gate rubric and why does each one exist specifically?',
            '3. What is the auto-fail rule, in exact wording, and what attack does it prevent?',
            '4. Why does the gate evaluation call use temperature=0 and why would temperature=0.7 break it?',
            '5. What are the two uses of embeddings in Codize and why is RAG explicitly NOT used for curriculum generation?',
            '6. What is RLS, why is "user is logged in" an insufficient ownership check, and what does your policy actually enforce?',
            '7. What are your scores across all 5 evals and what specific prompt changes did you make to improve them?',
            '8. Walk through the complete flow from a student submitting their Turn 3 answer to seeing PASS or FAIL — every step, every LLM call, every database write.',
          ],
          challenge:'If you can answer all 8 with confidence and specificity — not "I think it\'s something like..." — Phase 1 is complete. If you cannot answer 2 or more confidently, go back to those modules for one more day each. Phase 2 (building the full product) sits on this foundation. A weak foundation means rebuilt work later.'
        }
      }
    ]
  }
];

// STATE
let S={checkedDays:{},checkedTasks:{},journals:{},totalSeconds:0,sessions:[],activeModule:0,lastSessionDates:[]};
function loadState(){try{const r=localStorage.getItem('codize_v3');if(r)S=Object.assign({},S,JSON.parse(r));}catch(e){}}
function saveState(){try{localStorage.setItem('codize_v3',JSON.stringify(S));}catch(e){}}

// TIMER
let _running=false,_interval=null,_sessS=0,_startTs=null;
function timerStart(){
  if(_running)return;
  _running=true;_startTs=Date.now();
  document.getElementById('btnStart').classList.add('hidden');
  document.getElementById('btnStop').classList.remove('hidden');
  document.getElementById('timerDisp').classList.add('running');
  _interval=setInterval(function(){_sessS=Math.floor((Date.now()-_startTs)/1000);document.getElementById('timerDisp').textContent=fmtTime(_sessS);},1000);
  toast('Session started');
}
function timerStop(){
  if(!_running)return;
  _running=false;clearInterval(_interval);_interval=null;
  document.getElementById('btnStart').classList.remove('hidden');
  document.getElementById('btnStop').classList.add('hidden');
  document.getElementById('timerDisp').classList.remove('running');
  S.totalSeconds+=_sessS;
  const now=new Date();
  S.sessions.unshift({date:now.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),dur:fmtTime(_sessS)});
  if(S.sessions.length>20)S.sessions.length=20;
  const td=now.toDateString();
  if(!S.lastSessionDates)S.lastSessionDates=[];
  if(!S.lastSessionDates.includes(td)){S.lastSessionDates.push(td);if(S.lastSessionDates.length>60)S.lastSessionDates=S.lastSessionDates.slice(-60);}
  _sessS=0;_startTs=null;
  saveState();updateSidebar();renderSessionLog();toast('Session saved ✓');
}
function timerReset(){
  if(_running){timerStop();}
  _sessS=0;document.getElementById('timerDisp').textContent='00:00:00';
  document.getElementById('timerDisp').classList.remove('running');
  document.getElementById('btnStart').classList.remove('hidden');
  document.getElementById('btnStop').classList.add('hidden');
}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return[h,m,sc].map(n=>String(n).padStart(2,'0')).join(':');}
function renderSessionLog(){const el=document.getElementById('sessionLog');if(!el)return;el.innerHTML=(S.sessions||[]).slice(0,8).map(s=>'<div class="session-entry"><span>'+s.date+'</span><span>'+s.dur+'</span></div>').join('');}

// COUNTDOWN
function updateCountdown(){
  const diff=DEADLINE-new Date();
  if(diff<=0){['cdD','cdH','cdM','cdS'].forEach(id=>document.getElementById(id).textContent='00');return;}
  document.getElementById('cdD').textContent=String(Math.floor(diff/86400000)).padStart(2,'0');
  document.getElementById('cdH').textContent=String(Math.floor((diff%86400000)/3600000)).padStart(2,'0');
  document.getElementById('cdM').textContent=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  document.getElementById('cdS').textContent=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
}

// PACE
function getExpectedDay(){return Math.min(Math.floor((new Date()-START_DATE)/86400000)+1,TOTAL_DAYS);}
function getActualDay(){return Object.values(S.checkedDays).filter(Boolean).length;}
function getStreak(){
  if(!S.lastSessionDates||!S.lastSessionDates.length)return 0;
  let streak=0;const today=new Date();
  for(let i=0;i<60;i++){const d=new Date(today);d.setDate(d.getDate()-i);if(S.lastSessionDates.includes(d.toDateString()))streak++;else break;}
  return streak;
}
function updatePace(){
  const expected=getExpectedDay(),actual=getActualDay(),gap=actual-expected;
  document.getElementById('paceTarget').textContent='Day '+expected;
  document.getElementById('paceActual').textContent='Day '+actual;
  document.getElementById('paceBar').style.width=Math.min((actual/TOTAL_DAYS)*100,100)+'%';
  const msg=document.getElementById('paceMsg'),badge=document.getElementById('paceBadge'),gapEl=document.getElementById('statGap');
  if(gap>=2){msg.textContent='+'+gap+' days ahead';msg.style.background='var(--done-bg)';msg.style.color='var(--done)';badge.textContent='Ahead';badge.className='pace-badge pace-ahead';gapEl.textContent='+'+gap;gapEl.style.color='var(--done)';}
  else if(gap>=-1){msg.textContent='On track';msg.style.background='var(--accent-bg)';msg.style.color='var(--accent)';badge.textContent='On Track';badge.className='pace-badge pace-on';gapEl.textContent=gap===0?'0':gap;gapEl.style.color='var(--accent)';}
  else if(gap>=-3){msg.textContent=Math.abs(gap)+' days behind';msg.style.background='var(--warn-bg)';msg.style.color='var(--warn)';badge.textContent='Behind';badge.className='pace-badge pace-behind';gapEl.textContent=gap;gapEl.style.color='var(--warn)';}
  else{msg.textContent=Math.abs(gap)+' days behind — catch up';msg.style.background='var(--danger-bg)';msg.style.color='var(--danger)';badge.textContent='Catch Up';badge.className='pace-badge pace-late';gapEl.textContent=gap;gapEl.style.color='var(--danger)';}
}

// SIDEBAR
function updateSidebar(){
  const h=Math.floor(S.totalSeconds/3600),m=Math.floor((S.totalSeconds%3600)/60);
  document.getElementById('statDays').textContent=getActualDay()+'/'+TOTAL_DAYS;
  document.getElementById('statHours').textContent=h+'h '+m+'m';
  document.getElementById('statStreak').textContent=getStreak();
  document.getElementById('totalTime').textContent=h+'h '+m+'m';
  document.getElementById('statExpected').textContent='Day '+getExpectedDay();
  updatePace();renderModuleNav();
}
function renderModuleNav(){
  const nav=document.getElementById('moduleNav');
  nav.innerHTML=MODULES.map(m=>{
    const done=m.days.filter(d=>S.checkedDays[d.id]).length,total=m.days.length,isActive=m.id===S.activeModule,isDone=done===total&&total>0;
    return '<div class="mnav-item'+(isActive?' active':'')+(isDone?' done':'')+'" onclick="setModule('+m.id+')">'+'<div class="mnav-dot"></div>'+'<div class="mnav-text">M'+m.id+' — '+m.title+'</div>'+'<div class="mnav-prog">'+done+'/'+total+'</div>'+'</div>';
  }).join('');
}
function setModule(id){S.activeModule=id;saveState();renderModuleNav();renderContent();}

// CONTENT
function renderContent(){
  const mod=MODULES[S.activeModule];
  const done=mod.days.filter(d=>S.checkedDays[d.id]).length,total=mod.days.length,pct=total>0?Math.round((done/total)*100):0;
  const expectedDay=getExpectedDay();
  let html='';
  html+='<div class="mod-eyebrow">Module '+mod.id+' / Phase 1 &nbsp;·&nbsp; Spec v1.2</div>';
  html+='<div class="mod-title">'+mod.title+'</div>';
  html+='<div class="mod-desc">'+mod.desc+'</div>';
  html+='<div class="mod-meta"><div class="mod-meta-item">Duration: <strong>'+mod.duration+'</strong></div><div class="mod-meta-item">Days: <strong>'+mod.dayLabel+'</strong></div><div class="mod-meta-item">Progress: <strong>'+done+'/'+total+'</strong></div></div>';
  html+='<div class="mod-progress-bar"><div class="mod-progress-fill" style="width:'+pct+'%"></div></div>';
  mod.days.forEach(day=>{html+=renderDay(day,expectedDay);});
  document.getElementById('contentArea').innerHTML=html;
}
function renderDay(day,expectedDay){
  const isDone=!!S.checkedDays[day.id];
  let globalIdx=0,isToday=false;
  outer:for(let mi=0;mi<MODULES.length;mi++)for(let di=0;di<MODULES[mi].days.length;di++){globalIdx++;if(MODULES[mi].days[di].id===day.id){isToday=(globalIdx===expectedDay);break outer;}}
  const isOpen=!isDone||isToday;
  let html='<div class="day-card'+(isDone?' done-card':'')+'" id="card_'+day.id+'">';
  html+='<div class="day-head" onclick="toggleDay(\''+day.id+'\')">';
  html+='<div class="day-chk'+(isDone?' chk-done':'')+'" onclick="event.stopPropagation();checkDay(\''+day.id+'\')">'+( isDone?'✓':'' )+'</div>';
  html+='<div class="day-info"><div class="day-num-lbl">'+day.num+'</div><div class="day-title-text">'+day.title+'</div></div>';
  if(isToday&&!isDone)html+='<span class="today-badge">Today\'s Target</span>';
  html+='<div class="day-toggle-icon'+(isOpen?' open':'')+'" id="tog_'+day.id+'">▼</div>';
  html+='</div>';
  html+='<div class="day-body'+(isOpen?' open':'')+'" id="body_'+day.id+'">';
  if(day.note)html+='<div class="note-box">'+day.note+'</div>';
  if(day.specRef)html+='<div class="spec-box"><div class="spec-box-label">⬡ Spec Reference</div>'+day.specRef+'</div>';
  if(day.concepts&&day.concepts.length>0){html+='<div class="sec-label">Exact Concepts</div><ul class="concept-list">';day.concepts.forEach(c=>{html+='<li>'+fmtCode(c)+'</li>';});html+='</ul>';}
  if(day.codeBlock)html+='<div class="sec-label">Project Structure — Memorize This</div><div class="code-block">'+day.codeBlock+'</div>';
  if(day.resources&&day.resources.length>0){html+='<div class="sec-label">Resources</div><ul class="resource-list">';day.resources.forEach(r=>{html+='<li><a href="'+r.url+'" target="_blank" rel="noopener">'+r.text+'</a><span class="res-note">'+r.note+'</span></li>';});html+='</ul>';}
  if(day.checkpoint){
    html+='<div class="checkpoint-box"><div class="checkpoint-title-row"><span class="checkpoint-icon">Checkpoint</span><span class="checkpoint-title-text">'+day.checkpoint.title+'</span></div>';
    day.checkpoint.items.forEach((item,i)=>{const key=day.id+'_'+i,done=!!S.checkedTasks[key];html+='<div class="chk-item'+(done?' chk-done-item':'')+'" onclick="checkTask(\''+day.id+'\','+i+')"><div class="chk-sq">'+(done?'✓':'')+'</div><span>'+fmtCode(item)+'</span></div>';});
    if(day.checkpoint.challenge)html+='<div class="challenge-box"><div class="challenge-label">Challenge</div>'+day.checkpoint.challenge+'</div>';
    html+='</div>';
  }
  html+='<div class="journal-wrap"><div class="journal-top"><span class="journal-lbl">Dev Journal — '+day.num+'</span><div style="display:flex;align-items:center"><span class="journal-saved" id="jsaved_'+day.id+'">Saved</span><button class="journal-save" onclick="saveJournal(\''+day.id+'\')">Save</button></div></div><textarea class="journal-ta" id="jta_'+day.id+'" placeholder="What did you learn? What confused you? What clicked? Min 3 sentences. If you can\'t write it in plain English you don\'t understand it yet.">'+(S.journals[day.id]||'')+'</textarea></div>';
  html+='</div></div>';
  return html;
}
function fmtCode(text){return text.replace(/`([^`]+)`/g,'<code>$1</code>');}
function toggleDay(id){const b=document.getElementById('body_'+id),t=document.getElementById('tog_'+id);if(b){b.classList.toggle('open');t.classList.toggle('open');}}
function checkDay(id){S.checkedDays[id]=!S.checkedDays[id];saveState();updateSidebar();renderContent();if(S.checkedDays[id])toast('Day complete ✓');}
function checkTask(dayId,idx){const k=dayId+'_'+idx;S.checkedTasks[k]=!S.checkedTasks[k];saveState();renderContent();}
function saveJournal(id){const ta=document.getElementById('jta_'+id);if(!ta)return;S.journals[id]=ta.value;saveState();const sv=document.getElementById('jsaved_'+id);if(sv){sv.style.display='inline';setTimeout(()=>{sv.style.display='none';},2000);}}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='codize_progress_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);toast('Exported ↓');}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{S=Object.assign({},S,JSON.parse(ev.target.result));saveState();init();toast('Imported ✓');}catch(err){toast('Import failed');}};r.readAsText(f);e.target.value='';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function updateDate(){document.getElementById('todayDate').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});document.getElementById('statExpected').textContent='Day '+getExpectedDay();}
function init(){loadState();updateDate();updateSidebar();renderContent();renderSessionLog();setInterval(updateCountdown,1000);updateCountdown();}
init();
</script>
</body>
